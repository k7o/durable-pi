# A Durable Pi device, as a sandbox environment.
#
# Keep this file OUTSIDE the workspace it mounts. It declares a command that runs on your host
# (the enrollment hook), and a file inside a writable mount can be replaced by anyone who can
# write there — including the agent that runs in this sandbox. Copy it to something like
# ~/sbx-envs/durable-dev/sbxenv.yaml.
#
# One file, one device per invocation. Host ports are global, so the second device needs its own:
#
#   sbx env create ~/sbx-envs/durable-dev/sbxenv.yaml --force \
#     --env-arg device=device-a --env-arg hostPort=4780
#   sbx env create ~/sbx-envs/durable-dev/sbxenv.yaml --force \
#     --env-arg device=device-b --env-arg hostPort=4781
#
# Declare each device in dpi-network.yaml as `kind: url` before creating it; the hook registers
# the token against that declaration and prints what to add when it is missing.

schemaVersion: "1"

# The sandbox name and the device's display name both come from one argument.
name: ${{ env.args.device }}

# A v3 workload is selected by the last component of its image repository.
agent: sbx-kit-durable

args:
  device:
    default: device-a
    description: Device id. Must match the id declared in dpi-network.yaml.
  hostPort:
    default: "4780"
    description: Host port the hub reaches this device on. One per device.
  repo:
    default: /path/to/durable-pi
    description: Absolute path to the durable-pi checkout containing sbx/enroll.sh.

# The checkout the agents work in. This is the real host tree in direct mode.
workspace: /path/to/your/work

kits:
  # Published image. To iterate on a locally built one instead, build it with `just kit build`
  # and see the pullPolicy note below.
  - source: k7o/sbx-kit-durable:0.1.0
    # args:
    #   provider: opencode-go
    #   model: deepseek-v4.1-flash

# Provider selection for the device. It falls back on its own if the key for DPI_PROVIDER is not
# bound in this sandbox, and starts on faux if no key is bound at all.
env:
  DPI_PROVIDER: opencode-go
  DPI_MODEL: deepseek-v4.1-flash
  DPI_DEVICE_NAME: ${{ env.args.device }}

ports:
  - sandbox: 4780
    host: ${{ env.args.hostPort }}
    # hostIP defaults to Loopback, which is what a hub running on this host needs. Set
    # hostIP: 0.0.0.0 only if the hub cannot reach the loopback publish.
    # protocol defaults to tcp4; `tcp` would also bind ::1, where nothing is listening.

# Approve the credential injection domains these two services need. Merged into your global
# credentials.yaml; `sbx env rm --prune-bindings` would remove them for other sandboxes too.
bindings:
  opencode:
    apiKey:
      domains:
        - opencode.ai
  deepseek:
    apiKey:
      domains:
        - api.deepseek.com

# sandboxOptions:
#   memory: 4g
#   cpus: 2
#   # The image is built locally by `just kit build`, so a locally tagged kit needs:
#   # pullPolicy: never

lifecycle:
  postCreate:
    - name: Enroll the device with the hub
      command: ${{ env.args.repo }}/sbx/enroll.sh "$SBX_SANDBOX_NAME" "$SBX_SANDBOX_NAME"
